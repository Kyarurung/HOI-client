plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
base { archivesName = 'hoi-client' }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation project(':protocol')
    include project(':protocol')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hoi-client-test'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

tasks.withType(JavaExec).configureEach {
    if (name == 'runClientGameTest') {
        def pack = providers.gradleProperty('hoiResourcePack').orElse(rootProject.file('../HOI-resourcepack/build/resources.zip').absolutePath)
        systemProperty 'hoi.testResourcePack', pack.get()
        systemProperty 'hoi.testSuite', providers.gradleProperty('hoiTestSuite').orElse('all').get()
    }
}


sourceSets.gametest.resources.srcDir("src/test/resources")

sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('benchmarkMesh', JavaExec) {
    group = 'verification'
    description = 'Compares complete Java atlas mesh construction with the retained baseline.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'dev.hoi.client.map.scene.SceneMeshBenchmark'
    jvmArgs '-Xms1g', '-Xmx1g'
}

if (providers.gradleProperty('hoiTestSodium').orElse('false').get().toBoolean()) {
    repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
    dependencies { gametestRuntimeOnly 'maven.modrinth:sodium:mc26.3-0.9.2-fabric' }
}

apply from: rootProject.file('gradle/renderer-fixtures.gradle')

ext.hoiGameTestRunName = 'clientGameTest'
ext.hoiGameTestTaskName = 'runClientGameTest'
apply from: rootProject.file('gradle/isolated-gametest.gradle')
loom.runConfigs.named('clientGameTest') { runDirectory.set(hoiGameTestDirectory) }
