plugins { id 'base' }
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java-library'
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.14.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}


tasks.register('test') {
    group = 'verification'
    dependsOn ':protocol:test', ':client:test'
}
tasks.register('runGameTest') {
    group = 'verification'
    description = 'Runs research UI tests on the actual Minecraft client.'
    dependsOn ':client:runClientGameTest'
}
tasks.register('remapJar', Sync) {
    group = 'build'
    description = 'Stages only the client mod; Minecraft 26.3 is unobfuscated.'
    dependsOn ':client:jar'
    from project(':client').tasks.named('jar', Jar).flatMap { it.archiveFile }
    into layout.buildDirectory.dir('libs')
}
tasks.named('assemble') { dependsOn tasks.named('remapJar') }


tasks.register('verifyProtocolSources') {
    group = 'verification'
    doLast {
        def explicit = providers.gradleProperty('hoiProtocolSource').orNull
        def other = file(explicit ?: '../HOI/protocol/src/main/java')
        if (!other.isDirectory()) {
            if (explicit != null) throw new GradleException("Protocol source directory does not exist: ${other}")
            logger.lifecycle('Protocol source comparison skipped: sibling checkout is absent.')
            return
        }
        def sources = { File directory ->
            fileTree(directory).matching { include '**/*.java' }.files.collectEntries { source ->
                [(directory.toPath().relativize(source.toPath()).toString()): source.getText('UTF-8').replace('\r\n', '\n')]
            }
        }
        def local = sources(file('protocol/src/main/java'))
        def remote = sources(other)
        def changed = (local.keySet() + remote.keySet()).findAll { local[it] != remote[it] }.sort()
        if (!changed.isEmpty()) throw new GradleException("Protocol source mismatch: ${changed.join(', ')}")
        logger.lifecycle("Verified ${local.size()} shared protocol sources.")
    }
}
tasks.named('test') { dependsOn 'verifyProtocolSources' }
