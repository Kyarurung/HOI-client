name: Build and test client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: xvfb-run -a ./gradlew test runGameTest remapJar --console=plain --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoi-client-test-reports
          path: |
            protocol/build/test-results/
            client/build/test-results/
            client/build/run/clientGameTest/logs/
            client/build/run/clientGameTest/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: hoi-client-26.2
          path: build/libs/hoi-client-*.jar
          if-no-files-found: error
