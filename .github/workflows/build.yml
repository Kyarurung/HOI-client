name: Build and test client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check resource pack access
        env:
          PACK_SSH_KEY: ${{ secrets.HOI_RESOURCEPACK_SSH_KEY }}
        run: |
          if [ -z "$PACK_SSH_KEY" ]; then
            echo '::error::Configure HOI_RESOURCEPACK_SSH_KEY with the private resource pack repository read-only deploy key.'
            exit 1
          fi
      - name: Check out private resource pack
        uses: actions/checkout@v4
        with:
          repository: Kyarurung/HOI-resourcepack
          ref: 74f7f5b8b5e897d5e12ed23d0f08e83203cc47dd
          ssh-key: ${{ secrets.HOI_RESOURCEPACK_SSH_KEY }}
          path: .test-resourcepack
          persist-credentials: false
          sparse-checkout: |
            pack
            scripts
            portraits
      - run: python3 -m pip install numpy==2.3.5 Pillow==12.3.0
      - run: python3 .test-resourcepack/scripts/build_pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: xvfb-run -a ./gradlew test runGameTest remapJar --console=plain --no-daemon -PhoiResourcePack="$GITHUB_WORKSPACE/.test-resourcepack/build/resources.zip"
        env:
          ALSOFT_DRIVERS: 'null'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoi-client-test-reports
          path: |
            protocol/build/test-results/
            client/build/test-results/
            client/build/run/clientGameTest/logs/
            client/build/run/clientGameTest/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: hoi-client-26.2
          path: build/libs/hoi-client-*.jar
          if-no-files-found: error
